<!DOCTYPE html>
<html>
<head>
    <title>360° Tours</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            margin: 0; padding: 20px;
        }
        h1 { text-align: center; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .item {
            background: #222;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            transition: 0.3s;
        }
        .item:hover {
            background: #333;
            transform: scale(1.03);
        }
img {
    width: 75%;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
}

.item {
    padding: 8px;
}
        a {
            color: #fff;
            text-decoration: none;
        }

    </style>
</head>
<body>

<h1>360° Virtual Tours</h1>
<p style="text-align:center; font-size:26px; color:#fff; margin-top:-10px; margin-bottom:25px;">
    Select a city below to explore its 360° Interactive Tour. Inside each tour, click the Menu button in the top left corner to explore different scenes, available prints, and more.
</p>

<div class="grid">

    <div class="column">

        <!-- Marzipano Tour -->
        <a href="NewOrleansCityscape/index.html">
            <div class="item">
                <img src="Thumbnails/NolaSuperdomecoverphotoonly.jpg" alt="New Orleans 360 Interactive Experience">
                <h3>New Orleans 360 Experience</h3>
            </div>
        </a>

<!-- Cincinnati Marzipano Tour -->
<a href="CincinnatiCityscape/index.html">
    <div class="item">
        <img src="Thumbnails/CincyCover.jpg" alt="Cincinnati 360 Interactive Experience">
        <h3>Cincinnati 360 Experience</h3>
    </div>
</a>
    </div>

</div>

</body>
</html>
